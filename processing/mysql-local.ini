[mysqld]
basedir=D:/successpro-app-vscode/.tools/mysql
datadir=D:/successpro-app-vscode/.data/mysql-clean
tmpdir=D:/successpro-app-vscode/.data/tmp
port=3307
bind-address=127.0.0.1
mysqlx=0
max_connections=40
sort_buffer_size=4M
join_buffer_size=2M
innodb_buffer_pool_size=64M
