apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: successpro-web-staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 120
      serviceAccountName: successpro-web-staging@successpro-staging-1706786b.iam.gserviceaccount.com
      containers:
        - image: IMAGE_URL
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NEXT_PUBLIC_ENVIRONMENT
              value: staging
            - name: VERTEX_AI_LOCATION
              value: global
          startupProbe:
            httpGet:
              path: /api/health
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
            failureThreshold: 3
